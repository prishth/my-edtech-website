<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Dashboard | Prishth Test Series</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--navy:#1B3A5C;--steel:#2E6DA4;--bg:#F4F7FB;--border:#DDE6F0;--white:#FFFFFF;--gold:#E5A52A;--ink:#16283C;--muted:#5C6F84;--green:#2EA47C;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.topnav{background:var(--navy);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.topnav .brand{font-family:'Sora',sans-serif;font-weight:700;font-size:20px;color:#fff;text-decoration:none}
.topnav .right{display:flex;align-items:center;gap:16px;font-size:14px}
.topnav .right a{color:#cfe0f0;text-decoration:none}
.logout{background:var(--gold);color:var(--navy);border:none;padding:8px 16px;border-radius:8px;font-family:'Sora',sans-serif;font-weight:600;font-size:13px;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:30px 24px 60px}
h1{font-family:'Sora',sans-serif;font-size:28px;color:var(--navy);margin-bottom:4px}
.welcome{color:var(--muted);margin-bottom:28px}
.exam-block{margin-bottom:32px}
.exam-head{font-family:'Sora',sans-serif;font-size:19px;color:var(--navy);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--gold);display:inline-block}
.tests-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.test-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 2px 8px rgba(27,58,92,.05);display:flex;flex-direction:column;gap:12px}
.test-card h3{font-family:'Sora',sans-serif;font-size:16px;color:var(--navy)}
.test-meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px}
.chip{background:var(--bg);border:1px solid var(--border);padding:4px 10px;border-radius:999px;color:var(--muted);font-weight:600}
.chip.free{background:#E3F5EC;color:#1a7350;border-color:#2EA47C}
.chip.q{background:#EAF2FB;color:var(--steel);border-color:#bcd6f0}
.start-btn{margin-top:4px;background:var(--navy);color:#fff;text-align:center;padding:11px;border-radius:9px;text-decoration:none;font-family:'Sora',sans-serif;font-weight:600;font-size:14px;transition:.18s}
.start-btn:hover{background:var(--steel)}
.view-tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px}
.view-tabs a{padding:9px 18px;border-radius:9px;text-decoration:none;font-family:'Sora',sans-serif;
  font-weight:600;font-size:13.5px;background:#fff;border:1.5px solid var(--border);color:var(--navy)}
.view-tabs a:hover{border-color:var(--steel)}
.view-tabs a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.loading,.empty{text-align:center;color:var(--muted);padding:50px 20px}
.empty h3{font-family:'Sora',sans-serif;color:var(--navy);font-size:17px;margin-bottom:6px}
.empty p{max-width:420px;margin:0 auto 16px;font-size:14.5px}
.empty .go{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;
  padding:11px 22px;border-radius:9px;font-family:'Sora',sans-serif;font-weight:600;font-size:14px}
.empty-icon{font-size:40px;margin-bottom:10px}
.attempted-note{font-size:12px;color:var(--green);font-weight:600}
</style>
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "yg85fieck0");
</script>
</head>
<body>
<nav class="topnav">
  <a href="/" class="brand">Prishth</a>
  <div class="right">
    <a href="/pyqs">PYQs</a>
    <span id="userEmail"></span>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>
</nav>
<div class="wrap">
  <h1 id="pageTitle">Test Series</h1>
  <p class="welcome" id="welcome">Loading your dashboard…</p>
  <div class="view-tabs" id="viewTabs"></div>
  <div id="content"><div class="loading">Loading tests…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://aqrxmcmmdazyslznilbl.supabase.co","sb_publishable_wRKj-veZ1_Ro-HSH8kXCFg_ifvjUD8L");
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ window.location.href='/login?next=dashboard'; return; }
  document.getElementById('userEmail').textContent=session.user.email;

  // which view are we showing?
  const view=(new URLSearchParams(window.location.search).get('view')||'all').toLowerCase();
  const TITLES={
    all:      ['Test Series', 'Choose a test to begin. All your attempts are saved.'],
    free:     ['Free Tests',  'Every one of these is free. No payment, nothing to unlock.'],
    purchased:['My Purchases','Tests and study material you have bought.']
  };
  const meta=TITLES[view]||TITLES.all;
  document.getElementById('pageTitle').textContent=meta[0];
  document.getElementById('welcome').textContent=meta[1];
  document.title=meta[0]+' | Prishth Test Series';

  document.getElementById('viewTabs').innerHTML=
    ['all','free','purchased'].map(function(v){
      const label={all:'All Tests',free:'Free Tests',purchased:'My Purchases'}[v];
      return '<a class="'+(v===view?'on':'')+'" href="/dashboard'+(v==='all'?'':'?view='+v)+'">'+label+'</a>';
    }).join('');
  const [{data:tests},{data:questions},{data:attempts}]=await Promise.all([
    sb.from('tests').select('*').eq('is_published',true).order('exam'),
    sb.from('questions').select('test_id'),
    sb.from('attempts').select('test_id,score,total_marks')
  ]);
  const content=document.getElementById('content');

  // Paid purchases are not built yet, so "My Purchases" is honestly empty
  // rather than pretending. This becomes a real lookup once payments exist.
  if(view==='purchased'){
    content.innerHTML='<div class="empty"><div class="empty-icon">&#128274;</div>'+
      '<h3>Nothing purchased yet</h3>'+
      '<p>Paid mock tests and study material are on the way. When you buy something '+
      'it will appear here, ready to attempt.</p>'+
      '<a class="go" href="/dashboard?view=free">Browse free tests &rarr;</a></div>';
    return;
  }

  let visible=tests||[];
  if(view==='free') visible=visible.filter(function(t){ return t.is_free===true; });

  if(!visible.length){
    const msg = view==='free'
      ? '<h3>No free tests right now</h3><p>New free mocks are added regularly. Please check back soon.</p>'
      : '<h3>No tests available yet</h3><p>Please check back soon.</p>';
    content.innerHTML='<div class="empty"><div class="empty-icon">&#128221;</div>'+msg+
      '<a class="go" href="/pyqs">Download free PYQs &rarr;</a></div>';
    return;
  }
  const qcount={};
  (questions||[]).forEach(q=>{ if(q.test_id) qcount[q.test_id]=(qcount[q.test_id]||0)+1; });
  const bestAttempt={};
  (attempts||[]).forEach(a=>{ if(a.test_id && (!bestAttempt[a.test_id]||a.score>bestAttempt[a.test_id].score)) bestAttempt[a.test_id]=a; });
  const byExam={};
  visible.forEach(t=>{ (byExam[t.exam]=byExam[t.exam]||[]).push(t); });
  let html='';
  Object.keys(byExam).forEach(exam=>{
    html+='<div class="exam-block"><div class="exam-head">'+exam+'</div><div class="tests-grid">';
    byExam[exam].forEach(t=>{
      const nq=qcount[t.id]||0;
      const att=bestAttempt[t.id];
      const negTxt = t.marks_wrong!=0 ? (t.marks_wrong+' wrong') : 'No negative';
      html+='<div class="test-card"><h3>'+t.test_name+'</h3>'+
        '<div class="test-meta">'+
        '<span class="chip q">'+nq+' Question'+(nq!==1?'s':'')+'</span>'+
        '<span class="chip">'+t.duration_minutes+' min</span>'+
        '<span class="chip">+'+t.marks_correct+' / '+negTxt+'</span>'+
        (t.is_free?'<span class="chip free">Free</span>':'<span class="chip">Paid</span>')+
        '</div>'+
        (att?'<span class="attempted-note">Best score: '+att.score+' / '+att.total_marks+'</span>':'')+
        (nq>0?'<a class="start-btn" href="/test?id='+t.id+'">'+(att?'Re-attempt':'Start Test')+'</a>'
             :'<span class="start-btn" style="background:#ccc;cursor:not-allowed">No questions yet</span>')+
        '</div>';
    });
    html+='</div></div>';
  });
  content.innerHTML=html;
}
init();
document.getElementById('logoutBtn').addEventListener('click',async()=>{
  await sb.auth.signOut(); window.location.href='/';
});
</script>
</body>
</html>
